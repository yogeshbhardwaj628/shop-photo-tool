<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Shop Photo Formatter</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .upload-section {
            border: 2px dashed var(--border);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
            background: #f1f5f9;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            margin-top: 8px;
            text-decoration: none;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .settings-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
            font-size: 0.9rem;
        }

        .preview-container {
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-secondary {
            background-color: #059669;
        }
        .btn-secondary:hover {
            background-color: #047857;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>InstaShop Formatter</h1>
    <p class="subtitle">Format product photos into 1:1 squares with your store logo instantly.</p>

    <!-- Upload Product Photo -->
    <div class="upload-section">
        <label for="productImage" class="btn" style="cursor:pointer;">Upload Product Photo</label>
        <input type="file" id="productImage" accept="image/*" style="display:none;">
        <p style="font-size: 0.8rem; color: #64748b; margin-top: 8px;">Supports JPG, PNG</p>
    </div>

    <!-- Upload Store Logo -->
    <div class="settings-row">
        <label style="flex: 1;"><strong>Your Store Logo:</strong></label>
        <input type="file" id="logoImage" accept="image/*" style="font-size: 0.85rem;">
    </div>

    <!-- Live Preview Canvas Area -->
    <div class="preview-container" id="previewArea">
        <h3>Live Preview</h3>
        <canvas id="canvas"></canvas>
        
        <div class="actions">
            <!-- Free Download with Watermark -->
            <button class="btn" id="downloadWatermarked">Download Free (With Watermark)</button>
            
            <!-- Paid Clean Download Option -->
            <button class="btn btn-secondary" id="payAndDownload">Remove Watermark & Download HD (₹20)</button>
        </div>
    </div>
</div>

<!-- UPI Payment Verification Modal -->
<div id="paymentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000;">
    <div style="background:white; padding:24px; border-radius:12px; width:90%; max-width:380px; text-align:center;">
        <h3>Unlock Clean HD Image (₹20)</h3>
        <p style="font-size:0.85rem; color:#64748b; margin-bottom:12px;">
            Pay ₹20 to UPI Number: <strong style="color:#2563eb;">9816643856</strong>
        </p>

        <!-- Direct UPI App Button -->
        <a href="upi://pay?pa=9816643856@paytm&pn=Yogesh%20Bhardwaj&am=20&cu=INR" class="btn btn-secondary" style="display:block; text-decoration:none; text-align:center; margin-bottom:12px;">
            Pay ₹20 via UPI App
        </a>

        <!-- Screenshot Upload Section -->
        <div style="border: 2px dashed #cbd5e1; padding: 12px; border-radius: 8px; margin-bottom: 12px; background: #f8fafc; text-align: left;">
            <label style="font-size: 0.8rem; font-weight: bold; display: block; margin-bottom: 5px;">Upload Payment Screenshot:</label>
            <input type="file" id="paymentScreenshot" accept="image/*" style="font-size: 0.8rem; width: 100%;">
            <p style="font-size: 0.7rem; color: #64748b; margin-top: 4px;">Must be taken within the last 5 minutes.</p>
        </div>

        <!-- Submit for Verification -->
        <button class="btn" id="submitProofBtn" style="width:100%; margin-bottom:8px; background-color:#2563eb;">Verify & Download HD</button>
        <button class="btn" id="closeModalBtn" style="background:#64748b; width:100%;">Cancel</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
